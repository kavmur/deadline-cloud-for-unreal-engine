name: Conda Gate PoC
run-name: "CondaPoC|${{ inputs.mode }}|cinema4d-openjd|${{ inputs.version }}|linux-64,win-64|${{ inputs.recipe_commit }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Synthetic dev events or the supplied native C4D pipeline change
        required: true
        default: native
        type: choice
        options:
          - native
          - synthetic
      version:
        description: Example C4D adaptor version to check in the public manifest
        required: true
        default: "1.0.0"
        type: string
      recipe_commit:
        description: Exact example BealineCondaRecipes commit to observe
        required: true
        default: dbc23ab0837653f563f24043bfadf77e53f459f5
        type: string

permissions: {}

jobs:
  ValidateExample:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dev-only example metadata
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          RECIPE_COMMIT: ${{ inputs.recipe_commit }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          test "$REPOSITORY" = "kavmur/deadline-cloud-for-unreal-engine"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RECIPE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MODE" = native || "$MODE" = synthetic ]]
          if [[ "$MODE" = native ]]; then
            test "$VERSION" = "1.0.0"
            test "$RECIPE_COMMIT" = "dbc23ab0837653f563f24043bfadf77e53f459f5"
          fi
          printf 'Dev-only Conda gate PoC. No releases or AWS test jobs will be submitted.\n'
  WaitForConda:
    needs: ValidateExample
    environment: conda-poc
    runs-on: ubuntu-latest
    steps:
      - name: Confirm custom protection rule approved
        run: printf 'The Conda PoC gate opened for this workflow run.\n'
  Completed:
    needs: WaitForConda
    runs-on: ubuntu-latest
    steps:
      - name: Demonstrate same-run continuation
        run: printf 'POC COMPLETE — this same run resumed after the Conda gate.\n'
